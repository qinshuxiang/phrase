<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行测题库 · 国考 / 山西</title>
<style>
    :root {
        --bg: #0b0d10;
        --panel: #12151a;
        --panel-2: #171b21;
        --border: #242a33;
        --text: #e7eaee;
        --muted: #98a2ae;
        --accent: #4c8dff;
        --accent-soft: rgba(76, 141, 255, .14);
        --mark: #f2b544;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.75 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    button, input {
        font: inherit;
        color: inherit;
    }

    .app {
        display: flex;
        height: 100%;
        overflow: hidden;
    }

    /* 侧栏 */
    .sidebar {
        width: 272px;
        flex: 0 0 272px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .brand {
        padding: 16px 16px 12px;
        border-bottom: 1px solid var(--border);
    }

    .brand h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: .3px;
    }

    .brand p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
    }

    .search-wrap {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
    }

    .search-wrap input {
        width: 100%;
        padding: 8px 10px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        outline: none;
        font-size: 13px;
    }

    .search-wrap input:focus {
        border-color: var(--accent);
    }

    .list {
        flex: 1;
        overflow-y: auto;
        padding: 8px 8px 24px;
    }

    .cat {
        margin: 10px 8px 6px;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 1px;
        display: flex;
        justify-content: space-between;
    }

    .exam {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        border-radius: 8px;
        padding: 8px 10px;
        cursor: pointer;
    }

    .exam:hover { background: var(--panel-2); }

    .exam.active {
        background: var(--accent-soft);
        box-shadow: inset 2px 0 0 var(--accent);
    }

    .exam .t {
        font-size: 13px;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .exam .m {
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
        display: block;
    }

    .result {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        border-radius: 8px;
        background: transparent;
        padding: 8px 10px;
        cursor: pointer;
        font-size: 12px;
        color: var(--muted);
    }

    .result:hover { background: var(--panel-2); }

    .result b {
        color: var(--text);
        font-weight: 500;
    }

    /* 主区 */
    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
    }

    .topbar {
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .topbar .title {
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-left: auto;
    }

    .chip {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 12px;
        cursor: pointer;
    }

    .chip.on {
        color: var(--text);
        border-color: var(--accent);
        background: var(--accent-soft);
    }

    .stage {
        flex: 1;
        overflow-y: auto;
        padding: 22px 20px 40px;
    }

    .wrap {
        max-width: 820px;
        margin: 0 auto;
    }

    .meta-line {
        color: var(--muted);
        font-size: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
    }

    .badge {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1px 7px;
        font-size: 11px;
        color: var(--muted);
    }

    .material {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 16px;
        font-size: 14px;
        color: #cfd6de;
    }

    .mat-body {
        position: relative;
        max-height: 240px;
        overflow: hidden;
    }

    .material.open .mat-body {
        max-height: none;
    }

    .mat-body::after {
        content: "";
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 56px;
        background: linear-gradient(transparent, var(--panel));
        pointer-events: none;
    }

    .material.open .mat-body::after { display: none; }

    .mat-toggle {
        display: block;
        margin-top: 8px;
        border: 0;
        background: transparent;
        color: var(--accent);
        font-size: 12px;
        cursor: pointer;
        padding: 0;
    }

    .qno {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 6px;
    }

    .qno b {
        color: var(--accent);
        font-size: 15px;
        margin-right: 6px;
    }

    .stem {
        font-size: 16px;
        line-height: 1.9;
        margin-bottom: 18px;
        word-break: break-word;
    }

    .stem img, .opt img {
        max-width: 100%;
        display: inline-block;
        vertical-align: middle;
        margin: 4px 2px;
        border-radius: 4px;
        background: #fff;
    }

    .material img {
        max-width: 100%;
        display: block;
        margin: 8px 0;
        border-radius: 6px;
        background: #fff;
    }

    .options {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 26px;
    }

    .opt {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 10px;
        padding: 11px 14px;
        cursor: pointer;
        text-align: left;
        width: 100%;
    }

    .opt:hover { border-color: #3a4552; }

    .opt.picked {
        border-color: var(--accent);
        background: var(--accent-soft);
    }

    .opt.correct {
        border-color: #2f9e5f;
        background: rgba(47, 158, 95, .12);
    }

    .opt.correct .k {
        border-color: #2f9e5f;
        background: #2f9e5f;
        color: #fff;
    }

    .opt.wrong {
        border-color: #d9534f;
        background: rgba(217, 83, 79, .12);
    }

    .opt.wrong .k {
        border-color: #d9534f;
        background: #d9534f;
        color: #fff;
    }

    .opt .k {
        flex: 0 0 22px;
        height: 22px;
        border-radius: 50%;
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
    }

    .opt.picked .k {
        border-color: var(--accent);
        color: #fff;
        background: var(--accent);
    }

    .opt .v { flex: 1; min-width: 0; }

    .explain {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 22px;
        font-size: 14px;
        line-height: 1.85;
        color: #cfd6de;
    }

    .explain .exp-head {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 8px;
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .explain .exp-head b {
        color: #2f9e5f;
        font-size: 15px;
    }

    .explain .exp-body {
        white-space: pre-wrap;
    }

    .nav {
        display: flex;
        align-items: center;
        gap: 10px;
        border-top: 1px solid var(--border);
        padding-top: 16px;
    }

    .btn {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 8px;
        padding: 7px 14px;
        cursor: pointer;
        font-size: 13px;
    }

    .btn:hover { border-color: #3a4552; }

    .btn:disabled {
        opacity: .4;
        cursor: default;
    }

    .btn.accent {
        border-color: var(--accent);
        color: #fff;
        background: var(--accent);
    }

    .progress {
        flex: 1;
        height: 4px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
    }

    .progress span {
        display: block;
        height: 100%;
        background: var(--accent);
        width: 0;
    }

    .jump {
        width: 64px;
        padding: 6px 8px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        text-align: center;
        font-size: 13px;
    }

    .empty {
        color: var(--muted);
        text-align: center;
        padding: 80px 20px;
        font-size: 14px;
    }

    .hint {
        color: var(--muted);
        font-size: 12px;
        margin-top: 10px;
        line-height: 1.7;
    }

    .hint kbd {
        border: 1px solid var(--border);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 0 5px;
        font-size: 11px;
        font-family: inherit;
        background: var(--panel-2);
    }

    .mark-btn.on {
        color: var(--mark);
        border-color: var(--mark);
    }

    @media (max-width: 720px) {
        .sidebar { display: none; }
        .stage { padding: 16px 12px 30px; }
    }
</style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <h1>行测题库</h1>
            <p id="brand-sub"></p>
        </div>
        <div class="search-wrap">
            <input id="search" type="search" placeholder="搜索题干关键词">
        </div>
        <div class="list" id="list"></div>
    </aside>

    <main class="main">
        <div class="topbar">
            <div class="title" id="exam-title">选择题库</div>
            <div class="chips" id="chips"></div>
        </div>
        <div class="stage" id="stage">
            <div class="empty">从左侧选择一套试卷开始</div>
        </div>
    </main>
</div>

<script id="bank" type="application/json">__DATA__</script>
<script>
const BANK = JSON.parse(document.getElementById('bank').textContent);
const EXAMS = BANK.exams;
const IMG_BASE = '题库/';
const LS_KEY = 'xingce-bank-v1';

const state = {
    examId: null,
    no: 1,
    module: '',
    query: '',
    store: loadStore(),
    reveal: new Set()
};

function loadStore() {
    try {
        return JSON.parse(localStorage.getItem(LS_KEY)) || {};
    } catch (e) {
        return {};
    }
}

function saveStore() {
    try {
        localStorage.setItem(LS_KEY, JSON.stringify(state.store));
    } catch (e) {}
}

function examData(id) {
    return BANK.data[id];
}

function esc(text) {
    return text.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}

// 题干里的 ![](images/xxx) 渲染成图片，其余按纯文本转义
function renderRich(text) {
    const parts = text.split(/(!\[\]\([^)]*\))/g);
    return parts.map(part => {
        const m = /^!\[\]\(([^)]*)\)$/.exec(part);
        if (!m) return esc(part).replace(/\n/g, '<br>');
        const src = IMG_BASE + m[1];
        return `<img src="${esc(src)}" alt="">`;
    }).join('');
}

// 解析里的 **加粗** 转成 <strong>，其余按纯文本转义
function formatExplain(text) {
    return esc(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function currentExam() {
    return EXAMS.find(e => e.id === state.examId) || null;
}

function questionsOf(exam) {
    const data = examData(exam.id);
    if (!state.module) return data.questions;
    return data.questions.filter(q => q.module === state.module);
}

function currentQuestion() {
    const exam = currentExam();
    if (!exam) return null;
    return questionsOf(exam).find(q => q.no === state.no) || null;
}

function markKey(no) {
    return state.examId + ':' + no;
}

function renderList() {
    const list = document.getElementById('list');
    if (state.query) {
        const q = state.query.toLowerCase();
        const hits = [];
        EXAMS.forEach(exam => {
            examData(exam.id).questions.forEach(item => {
                if (item.stem.toLowerCase().includes(q)) hits.push({ exam, item });
            });
        });
        const shown = hits.slice(0, 60);
        list.innerHTML = `<div class="cat"><span>搜索结果</span><span>${hits.length}</span></div>` +
            (shown.map(h => `<button class="result" data-exam="${h.exam.id}" data-no="${h.item.no}">
                <b>${esc(h.exam.title.slice(0, 22))}</b> 第 ${h.item.no} 题<br>${esc(h.item.stem.replace(/!\[\]\([^)]*\)/g, '[图]').slice(0, 42))}
            </button>`).join('') || '<div class="result">没有匹配</div>');
        return;
    }

    let html = '';
    ['国考', '山西'].forEach(cat => {
        const group = EXAMS.filter(e => e.category === cat);
        if (!group.length) return;
        html += `<div class="cat"><span>${cat}</span><span>${group.length} 套</span></div>`;
        group.forEach(exam => {
            const active = exam.id === state.examId ? ' active' : '';
            html += `<button class="exam${active}" data-exam="${exam.id}">
                <span class="t">${esc(exam.titleShort)}</span>
                <span class="m">${exam.examType} · ${exam.questionCount} 题${exam.answered ? ` · 答案 ${exam.answered}` : ""}</span>
            </button>`;
        });
    });
    list.innerHTML = html;
}

function renderChips(exam) {
    const chips = document.getElementById('chips');
    const parts = [`<button class="chip${state.module ? '' : ' on'}" data-module="">全部</button>`];
    exam.modules.forEach(m => {
        const on = state.module === m.name ? ' on' : '';
        parts.push(`<button class="chip${on}" data-module="${esc(m.name)}">${esc(m.name)} ${m.count}</button>`);
    });
    chips.innerHTML = parts.join('');
}

function renderStage(keepScroll = false) {
    const stage = document.getElementById('stage');
    const scroll = keepScroll ? stage.scrollTop : 0;
    const exam = currentExam();

    if (!exam) {
        stage.innerHTML = '<div class="empty">从左侧选择一套试卷开始</div>';
        return;
    }

    const data = examData(exam.id);
    const qs = questionsOf(exam);
    const q = currentQuestion();
    document.getElementById('exam-title').textContent = exam.title;

    if (!q) {
        stage.innerHTML = '<div class="empty">这个模块下没有题目</div>';
        return;
    }

    const picked = (state.store.picks || {})[markKey(q.no)];
    const marked = (state.store.marks || {})[markKey(q.no)];
    const answer = (q.answer || '').toUpperCase();
    const revealKey = markKey(q.no);
    const revealed = Boolean(answer) && (Boolean(picked) || state.reveal.has(revealKey));
    const isRight = Boolean(answer) && picked === answer;
    const material = q.material === null ? '' : data.materials[q.material];

    let html = '<div class="wrap">';
    html += `<div class="meta-line">
        <span class="badge">${esc(q.module)}</span>
        <span>第 ${qs.indexOf(q) + 1} / ${qs.length} 题</span>
        <span>全卷第 ${q.no} 题</span>
    </div>`;

    if (material) {
        html += `<div class="material open" id="material">
            <div class="mat-body">${renderRich(material)}</div>
            <button class="mat-toggle" id="mat-toggle">收起材料</button>
        </div>`;
    }

    html += `<div class="stem">${renderRich(q.stem)}</div>`;
    html += '<div class="options">';
    q.options.forEach(opt => {
        let cls = '';
        if (revealed && answer.includes(opt.label)) cls = ' correct';
        else if (revealed && picked === opt.label) cls = ' wrong';
        else if (picked === opt.label) cls = ' picked';
        html += `<button class="opt${cls}" data-opt="${opt.label}">
            <span class="k">${opt.label}</span>
            <span class="v">${renderRich(opt.text)}</span>
        </button>`;
    });
    html += '</div>';

    if (revealed) {
        const body = q.explain ? formatExplain(q.explain) : '该题原卷未收录解析，仅提供答案。';
        html += `<div class="explain">
            <div class="exp-head">答案 <b>${answer}</b>${picked ? (isRight ? '<span>回答正确</span>' : '<span>回答错误</span>') : ''}</div>
            <div class="exp-body">${body}</div>
        </div>`;
    }

    const atStart = qs.indexOf(q) === 0;
    const atEnd = qs.indexOf(q) === qs.length - 1;
    html += `<div class="nav">
        <button class="btn" id="prev"${atStart ? ' disabled' : ''}>上一题</button>
        <input class="jump" id="jump" value="${q.no}" inputmode="numeric">
        <div class="progress"><span style="width:${((qs.indexOf(q) + 1) / qs.length * 100).toFixed(1)}%"></span></div>
        <button class="btn" id="next"${atEnd ? ' disabled' : ''}>下一题</button>
        <button class="btn mark-btn${marked ? ' on' : ''}" id="mark">标记</button>
        ${answer ? `<button class="btn" id="reveal">${revealed ? '收起答案' : '看答案'}</button>` : ''}
    </div>`;
    html += `<div class="hint">
        快捷键：<kbd>1</kbd>~<kbd>4</kbd> 选选项 · <kbd>←</kbd><kbd>→</kbd> 切题 · <kbd>M</kbd> 标记。
        有答案的题点选项即判分并展开解析；暂无答案的题只记录自测选择。进度保存在本机浏览器。
    </div>`;
    html += '</div>';
    stage.innerHTML = html;
    stage.scrollTop = scroll;

    const mat = document.getElementById('material');
    if (mat) {
        document.getElementById('mat-toggle').addEventListener('click', () => {
            mat.classList.toggle('open');
            document.getElementById('mat-toggle').textContent = mat.classList.contains('open') ? '收起材料' : '展开材料';
        });
    }
}

function openExam(id, no) {
    state.examId = id;
    state.module = '';
    const exam = currentExam();
    state.no = no || (state.store.last && state.store.last[id]) || examData(id).questions[0].no;
    state.query = '';
    document.getElementById('search').value = '';
    location.hash = `#/exam/${id}/${state.no}`;
    renderList();
    renderChips(exam);
    renderStage();
}

function go(no) {
    const exam = currentExam();
    if (!exam) return;
    const q = examData(exam.id).questions.find(item => item.no === no);
    if (!q) return;
    if (state.module && q.module !== state.module) state.module = '';
    state.no = no;
    state.store.last = state.store.last || {};
    state.store.last[exam.id] = no;
    saveStore();
    location.hash = `#/exam/${exam.id}/${no}`;
    renderChips(exam);
    renderStage();
}

function step(delta) {
    const exam = currentExam();
    if (!exam) return;
    const qs = questionsOf(exam);
    const idx = qs.findIndex(q => q.no === state.no);
    const next = qs[idx + delta];
    if (next) go(next.no);
}

document.getElementById('list').addEventListener('click', ev => {
    const btn = ev.target.closest('button');
    if (!btn) return;
    if (btn.dataset.exam) {
        openExam(btn.dataset.exam, Number(btn.dataset.no) || null);
    }
});

document.getElementById('chips').addEventListener('click', ev => {
    const btn = ev.target.closest('button[data-module]');
    if (!btn) return;
    const exam = currentExam();
    state.module = btn.dataset.module;
    const qs = questionsOf(exam);
    if (qs.length) state.no = qs[0].no;
    renderChips(exam);
    renderStage();
});

document.getElementById('stage').addEventListener('click', ev => {
    const opt = ev.target.closest('.opt');
    if (opt) {
        const key = markKey(state.no);
        state.store.picks = state.store.picks || {};
        if (state.store.picks[key] === opt.dataset.opt) delete state.store.picks[key];
        else state.store.picks[key] = opt.dataset.opt;
        saveStore();
        renderStage(true);
        return;
    }
    if (ev.target.id === 'reveal') {
        const key = markKey(state.no);
        if (state.reveal.has(key)) state.reveal.delete(key);
        else state.reveal.add(key);
        renderStage(true);
        return;
    }
    if (ev.target.id === 'prev') step(-1);
    if (ev.target.id === 'next') step(1);
    if (ev.target.id === 'mark') {
        const key = markKey(state.no);
        state.store.marks = state.store.marks || {};
        if (state.store.marks[key]) delete state.store.marks[key];
        else state.store.marks[key] = 1;
        saveStore();
        renderStage(true);
    }
});

document.getElementById('stage').addEventListener('change', ev => {
    if (ev.target.id === 'jump') {
        const no = parseInt(ev.target.value, 10);
        if (no) go(no);
    }
});

document.getElementById('search').addEventListener('input', ev => {
    state.query = ev.target.value.trim();
    renderList();
});

document.addEventListener('keydown', ev => {
    if (ev.target.tagName === 'INPUT') return;
    if (ev.key >= '1' && ev.key <= '4') {
        const label = 'ABCD'[Number(ev.key) - 1];
        const key = markKey(state.no);
        state.store.picks = state.store.picks || {};
        if (state.store.picks[key] === label) delete state.store.picks[key];
        else state.store.picks[key] = label;
        saveStore();
        renderStage(true);
    } else if (ev.key === 'ArrowRight') {
        step(1);
    } else if (ev.key === 'ArrowLeft') {
        step(-1);
    } else if (ev.key === 'm' || ev.key === 'M') {
        const key = markKey(state.no);
        state.store.marks = state.store.marks || {};
        if (state.store.marks[key]) delete state.store.marks[key];
        else state.store.marks[key] = 1;
        saveStore();
        renderStage(true);
    }
});

function boot() {
    document.getElementById('brand-sub').textContent =
        `${EXAMS.length} 套 · ${EXAMS.reduce((n, e) => n + e.questionCount, 0)} 题`;
    const m = /^#\/exam\/([\w-]+)\/(\d+)/.exec(location.hash);
    if (m) {
        state.examId = m[1];
        const exam = currentExam();
        if (exam) {
            state.no = Number(m[2]);
            renderList();
            renderChips(exam);
            renderStage();
            return;
        }
    }
    renderList();
}

boot();
</script>
</body>
